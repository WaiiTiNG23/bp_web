<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BP-Dev | Contacto</title>
  <link rel="icon" href="../assets/img/favicon.ico">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<header class="header">
  <div class="container d-flex justify-content-between align-items-center header-content">
    <a href="../index.html" class="logo-box">
      <img src="../assets/img/logo.svg" alt="Logo BP-Dev" class="logo-img">
      <span class="logo-text">BP-Dev</span>
    </a>
    <nav class="nav d-none d-lg-flex align-items-center">
      <a href="../index.html">Inicio</a>
      <a href="about.html">Sobre mí</a>
      <a href="services.html">Servicios</a>
      <a href="projects.html">Proyectos</a>
      <a href="contact.html" class="active">Contacto</a>
    </nav>
    <button class="btn btn-outline-light d-lg-none" data-bs-toggle="offcanvas" data-bs-target="#menuMobile">☰</button>
  </div>
</header>

<div class="offcanvas offcanvas-end text-bg-dark" id="menuMobile">
  <div class="offcanvas-header">
    <h5 class="offcanvas-title">Menú</h5>
    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
  </div>
  <div class="offcanvas-body d-flex flex-column gap-2">
    <a href="../index.html">Inicio</a>
    <a href="about.html">Sobre mí</a>
    <a href="services.html">Servicios</a>
    <a href="projects.html">Proyectos</a>
    <a href="contact.html">Contacto</a>
  </div>
</div>

<main class="section">
  <div class="container">
    <h1 class="section-title">Contacto</h1>
    <p class="section-subtitle">Si tenés una idea, proyecto o querés cotizar una web, escribime.</p>

    <div class="row justify-content-center">
      <div class="col-lg-7">
        <div class="form-box p-4">
          <form>
            <div class="mb-3">
              <label class="form-label">Nombre</label>
              <input type="text" class="form-control" placeholder="Tu nombre" required>
            </div>

            <div class="mb-3">
              <label class="form-label">Email</label>
              <input type="email" class="form-control" placeholder="tu@email.com" required>
            </div>

            <div class="mb-3">
              <label class="form-label">Mensaje</label>
              <textarea class="form-control" rows="5" placeholder="Contame sobre tu proyecto..." required></textarea>
            </div>

            <button class="btn btn-glow w-100" type="submit">Enviar mensaje</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</main>

<footer class="footer">
  <div class="container">
    <div class="socials">
      <a href="#"><img src="../assets/img/linkedin.svg" alt="LinkedIn"></a>
      <a href="#"><img src="../assets/img/github.svg" alt="GitHub"></a>
      <a href="#"><img src="../assets/img/instagram.svg" alt="Instagram"></a>
      <a href="#"><img src="../assets/img/telegram.svg" alt="Telegram"></a>
      <a href="#"><img src="../assets/img/gmail.svg" alt="Mail"></a>
    </div>
    <p class="mb-0">© 2026 BP-Dev</p>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

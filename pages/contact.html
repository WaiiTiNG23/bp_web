<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BP-Dev | Contacto</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<header class="header">
  <div class="container header-content d-flex justify-content-between align-items-center">
    <h2 class="logo">BP-Dev</h2>
    <nav class="nav d-none d-lg-flex">
      <a href="../index.html">Inicio</a>
      <a href="about.html">Sobre mí</a>
      <a href="services.html">Servicios</a>
      <a href="projects.html">Proyectos</a>
      <a href="contact.html">Contacto</a>
    </nav>
  </div>
</header>

<main class="section">
  <div class="container">
    <h1 class="section-title">Contacto</h1>

    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="form-box">
          <form>
            <div class="mb-3">
              <label class="form-label">Nombre</label>
              <input type="text" class="form-control">
            </div>

            <div class="mb-3">
              <label class="form-label">Email</label>
              <input type="email" class="form-control">
            </div>

            <div class="mb-3">
              <label class="form-label">Mensaje</label>
              <textarea class="form-control" rows="4"></textarea>
            </div>

            <button class="btn btn-primary w-100">Enviar mensaje</button>
          </form>
        </div>
      </div>
    </div>

  </div>
</main>

<footer class="footer">
  <div class="container">
    <div class="socials">
      <a href="#"><img src="../assets/img/linkedin.svg"></a>
      <a href="#"><img src="../assets/img/github.svg"></a>
      <a href="#"><img src="../assets/img/instagram.svg"></a>

      <a href="#"><img src="../assets/img/gmail.svg"></a>
    </div>

  </div>
</footer>
